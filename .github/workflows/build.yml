name: Build Python Executable

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Compile Script to EXE
      run: |
        pyinstaller --onefile --windowed main_menu.py

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'dev-latest' }}
        name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || 'Development Beta Build' }}
        prerelease: ${{ github.ref_type != 'tag' }}
        make_latest: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
        target_commitish: ${{ github.sha }}
        files: dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
